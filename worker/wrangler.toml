# Cloudflare Worker that records who follows which unit (see src/index.js), and the update
# watchdog that starts the data update on time (src/watchdog.js).
# Deployed by .github/workflows/follow-server.yml, which fills in the database id.
name = "ercot-follows"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
SITE_URL = "https://ercotbids.currenttech.energy/"
FROM = "ERCOT bid explorer <alerts@currenttech.energy>"
REPO = "CurrentTechEnergy/ercot-bid-explorer"   # the watchdog starts this repository's update.yml

# every 15 minutes, in UTC: the watchdog works out the Central time itself
[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "ercot-follows"
database_id = "DATABASE_ID"
