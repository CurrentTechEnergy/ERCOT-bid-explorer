name: Back up data

# Weekly copy of the stores that exist only once, into a private Cloudflare R2 bucket kept apart
# from ercot-raw (default name ercot-backup), one folder per run: backups/YYYY-MM-DD-HHMM/ (UTC)
#   data.bundle        the `data` branch (per-unit data; every run replaces its single commit)
#   history/           the `history` and `behaviour` release assets (built before the raw store
#                      existed, so their source files are not in R2)
#   ercot-raw-private/ the private/ files in ercot-raw (state the pipeline overwrites each run)
#   d1/                SQL exports of the follower database (ercot-follows) and the Ask the data
#                      log (ercot-ask); these hold email addresses, so they never go in this repo
#   manifest.txt       size and SHA-256 of every file above
# Makes no ERCOT calls.  Retention is the bucket's own: a bucket lock rule keeps each snapshot for
# 28 days and a lifecycle rule deletes it after 35 (see README, Backups, which also says how to
# restore each item).
#
# Needs the repository secrets BACKUP_R2_ACCESS_KEY_ID and BACKUP_R2_SECRET_ACCESS_KEY (an R2 API
# token with Object Read & Write on the backup bucket only), plus the existing R2_ENDPOINT,
# R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY (to read ercot-raw/private/) and CLOUDFLARE_API_TOKEN
# (D1 export).  Without the backup secrets the run only says so and passes.  Optional repository
# variable BACKUP_R2_BUCKET overrides the bucket name.
on:
  schedule:
    - cron: "0 9 * * 0"     # Sundays 09:00 UTC: 02:00 MST / 03:00 MDT, hours before the morning update
  workflow_dispatch:

permissions:
  contents: read

# Its own group: sharing update-data would let a queued backup cancel a queued update.
concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BUCKET: ${{ vars.BACKUP_R2_BUCKET || 'ercot-backup' }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      BACKUP_KEY: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
      BACKUP_SECRET: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
      RAW_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
      RAW_SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      WRANGLER: npx --yes wrangler@4.151.3
      AWS_DEFAULT_REGION: auto
      # R2 does not take the AWS CLI's default extra checksums on every request
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: Check the secrets
        id: secrets
        run: |
          missing=""
          for s in R2_ENDPOINT BACKUP_KEY BACKUP_SECRET; do [ -n "${!s}" ] || missing="$missing $s"; done
          if [ -n "$missing" ]; then
            echo "::notice::No backup made: add the repository secrets BACKUP_R2_ACCESS_KEY_ID and BACKUP_R2_SECRET_ACCESS_KEY (see README, Backups)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "DAY=$(date -u +%Y-%m-%d-%H%M)"   # a re-run gets its own folder: locked objects can't be overwritten >> "$GITHUB_ENV"
            mkdir -p "$RUNNER_TEMP/snap"
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: steps.secrets.outputs.ready == 'true'

      - name: Bundle the data branch
        if: steps.secrets.outputs.ready == 'true'
        run: |
          git fetch --depth 1 origin data
          git branch -f data FETCH_HEAD
          git bundle create "$RUNNER_TEMP/snap/data.bundle" data
          git bundle verify "$RUNNER_TEMP/snap/data.bundle"
          echo "data branch: $(git log -1 --format='%h %s' data)"

      - name: Download the history releases
        if: steps.secrets.outputs.ready == 'true'
        run: |
          for tag in history behaviour; do
            gh release download "$tag" -R "$GITHUB_REPOSITORY" -D "$RUNNER_TEMP/snap/history/$tag"
            echo "$tag: $(find "$RUNNER_TEMP/snap/history/$tag" -type f | wc -l) files"
          done

      - name: Copy the private files from ercot-raw
        if: steps.secrets.outputs.ready == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          # the R2 secrets may end in a newline, which the AWS CLI rejects (pipeline/raw_store.py strips it too)
          R2_ENDPOINT=$(printf %s "$R2_ENDPOINT" | tr -d '[:space:]')
          AWS_ACCESS_KEY_ID=$(printf %s "$AWS_ACCESS_KEY_ID" | tr -d '[:space:]')
          AWS_SECRET_ACCESS_KEY=$(printf %s "$AWS_SECRET_ACCESS_KEY" | tr -d '[:space:]')
          export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
          aws s3 cp --recursive --only-show-errors --endpoint-url "$R2_ENDPOINT" \
            s3://ercot-raw/private/ "$RUNNER_TEMP/snap/ercot-raw-private/"
          echo "private files: $(find "$RUNNER_TEMP/snap/ercot-raw-private" -type f 2>/dev/null | wc -l)"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: steps.secrets.outputs.ready == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: "22"

      # wrangler finds the database through the Worker's wrangler.toml, so fill in its id the way
      # the deploy workflows do (the change is never committed).
      - name: Export the D1 databases
        if: steps.secrets.outputs.ready == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          mkdir -p "$RUNNER_TEMP/snap/d1"
          failed=""
          for pair in worker:ercot-follows ask-worker:ercot-ask; do
            dir=${pair%%:*}; db=${pair#*:}
            id=$(cd "$dir" && $WRANGLER d1 list --json | jq -r --arg n "$db" '.[] | select(.name == $n) | .uuid')
            if [ -z "$id" ]; then echo "$db: no such database, skipped"; continue; fi
            sed -i "s/DATABASE_ID/$id/" "$dir/wrangler.toml"
            (cd "$dir" && $WRANGLER d1 export "$db" --remote --output "$RUNNER_TEMP/snap/d1/$db.sql") || failed="$failed $db"
          done
          git checkout -- worker ask-worker
          [ -z "$failed" ] || { echo "::error::D1 export failed for:$failed"; exit 1; }

      - name: Upload the snapshot
        if: steps.secrets.outputs.ready == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
        run: |
          # the R2 secrets may end in a newline, which the AWS CLI rejects (pipeline/raw_store.py strips it too)
          R2_ENDPOINT=$(printf %s "$R2_ENDPOINT" | tr -d '[:space:]')
          AWS_ACCESS_KEY_ID=$(printf %s "$AWS_ACCESS_KEY_ID" | tr -d '[:space:]')
          AWS_SECRET_ACCESS_KEY=$(printf %s "$AWS_SECRET_ACCESS_KEY" | tr -d '[:space:]')
          export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
          cd "$RUNNER_TEMP/snap"
          find . -type f -printf '%P\n' | sort | while read -r f; do
            printf '%s  %s  %s\n' "$(sha256sum "$f" | cut -c1-64)" "$(stat -c %s "$f")" "$f"
          done > "$RUNNER_TEMP/manifest.txt"
          mv "$RUNNER_TEMP/manifest.txt" manifest.txt
          aws s3 cp --recursive --only-show-errors --endpoint-url "$R2_ENDPOINT" . "s3://$BUCKET/backups/$DAY/"
          # read the listing back: every file in the manifest must be in the bucket at its size
          aws s3 ls --recursive --endpoint-url "$R2_ENDPOINT" "s3://$BUCKET/backups/$DAY/" \
            | awk -v p="backups/$DAY/" '{ sub(p, "", $4); print $3, $4 }' | sort > "$RUNNER_TEMP/listed.txt"
          awk '{ print $2, $3 }' manifest.txt | sort > "$RUNNER_TEMP/expected.txt"
          if ! comm -23 "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/listed.txt" | grep -q .; then
            echo "Snapshot backups/$DAY in $BUCKET: $(wc -l < manifest.txt) files, $(du -sh . | cut -f1)"
          else
            echo "::error::Files missing from the bucket after upload:"; comm -23 "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/listed.txt"
            exit 1
          fi
          {
            echo "### Backup backups/$DAY in $BUCKET"; echo
            echo "| Item | Files | Size |"; echo "|---|---|---|"
            for d in data.bundle history ercot-raw-private d1; do
              [ -e "$d" ] && echo "| $d | $(find "$d" -type f | wc -l) | $(du -sh "$d" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
