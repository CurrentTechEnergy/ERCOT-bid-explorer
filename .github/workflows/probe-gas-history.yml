name: Probe OilPriceAPI gas history

# How far back the Houston Ship Channel codes go on OilPriceAPI, before buying credits
# (pipeline/probe_gas_history.py).  About 7 calls; responses kept in R2, so a rerun spends none.
# The report has counts and dates only, never prices.
on:
  pull_request:       # runs on a PR that changes the probe, so the result is on the PR before merge
    paths:
      - pipeline/probe_gas_history.py
      - .github/workflows/probe-gas-history.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements.lock
      - name: Probe the Ship Channel codes
        env:
          OILPRICEAPI_KEY: ${{ secrets.OILPRICEAPI_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m pipeline.probe_gas_history | tee -a "$GITHUB_STEP_SUMMARY"
