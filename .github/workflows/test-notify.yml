name: Check subscriber email logs

# Runs pipeline/test_notify.py: subscriber emails on fake follows must never print a follower's
# address or a working link, since this repository's run logs are public.  No secrets, no network.
on:
  pull_request:
    paths:
      - pipeline/notify.py
      - pipeline/test_notify.py
      - .github/workflows/test-notify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements.lock
      - run: python -m pipeline.test_notify
