name: Test SHA override (temporary)
on:
  push:
    branches: [test/sha-override]
permissions: {}
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: echo "default=$GITHUB_SHA"
      - env:
          GITHUB_SHA: overridden-step-env
        run: echo "step env=$GITHUB_SHA"
      - uses: actions/github-script@v7
        env:
          GITHUB_SHA: overridden-step-env
        with:
          script: console.log('js action sees', process.env.GITHUB_SHA)
