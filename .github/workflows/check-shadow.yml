name: Check the SCED shadow price report

# Reads a few recent postings of ERCOT's SCED shadow prices and binding constraints report
# (NP6-86-CD) with pipeline/shadow.py's parser and prints what it read.  Writes nothing.
on:
  pull_request:       # runs on a PR that changes the parser, so the result is on the PR before merge
    paths:
      - pipeline/shadow.py
      - .github/workflows/check-shadow.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements.lock
      - name: Parse recent postings
        env:
          ERCOT_API_USERNAME: ${{ secrets.ERCOT_API_USERNAME }}
          ERCOT_API_PASSWORD: ${{ secrets.ERCOT_API_PASSWORD }}
          ERCOT_API_SUBSCRIPTION_KEY: ${{ secrets.ERCOT_API_SUBSCRIPTION_KEY }}
        run: python -m pipeline.shadow --sample
