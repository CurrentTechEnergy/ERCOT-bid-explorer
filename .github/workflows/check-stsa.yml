name: Check the STSA report

# Fills a copy of the STSA file (pipeline/stsa.py) from January 2024 and keeps it as a run
# artifact, so the fetch and the model can be checked before merge.  Writes nothing to the repo.
on:
  pull_request:       # runs on a PR that changes the parser, so the result is on the PR before merge
    paths:
      - pipeline/stsa.py
      - .github/workflows/check-stsa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fill a copy of the STSA file from January 2024
        env:
          ERCOT_API_USERNAME: ${{ secrets.ERCOT_API_USERNAME }}
          ERCOT_API_PASSWORD: ${{ secrets.ERCOT_API_PASSWORD }}
          ERCOT_API_SUBSCRIPTION_KEY: ${{ secrets.ERCOT_API_SUBSCRIPTION_KEY }}
        run: python -m pipeline.stsa --sample "$RUNNER_TEMP/stsa.json.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: stsa
          path: ${{ runner.temp }}/stsa.json.gz
