name: Behaviour change

# The monthly behaviour-change check (analysis/behaviour_change.py): CC, gas steam and CT units
# against rules frozen on a base year, run forward on the forecast's own inputs (main's site/data,
# the data branch and the thermal history release).  Results go to the `behaviour` release, the
# latest under fixed names (behaviour-change.md, cc-gs-change-log.csv, ct-change-log.csv,
# summary.json) and each month's under a YYYY-MM- prefix, and the report to the run summary.  Each
# run lists what is new since the latest one on the release.  Reads only, so it needs no slot in
# the update's concurrency group.
on:
  schedule:
    - cron: "17 15 3 * *"     # the 3rd of each month, between the update's two runs
  workflow_dispatch:
    inputs:
      base_end:
        description: "Last day of the base year the rules are frozen on"
        required: false
        default: "2024-12-31"

permissions:
  contents: write     # release assets only

concurrency:
  group: behaviour
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Inputs (the data branch, the history release, the last run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --depth 1 origin data && git worktree add --detach unitdata FETCH_HEAD
          gh release download history -R "$GITHUB_REPOSITORY" -p 'thermal-*.parquet' -p 'da-hubs-202[4-9]-*.parquet' -D history
          if gh release view behaviour -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release download behaviour -R "$GITHUB_REPOSITORY" -p 'cc-gs-change-log.csv' -p 'ct-change-log.csv' -D previous || true
          else
            gh release create behaviour -R "$GITHUB_REPOSITORY" --title "Behaviour change" --latest=false \
              --notes "Monthly behaviour-change check by the Behaviour change workflow (analysis/behaviour_change.py documents the method and files)."
          fi
      - name: Run the check
        env:
          PYTHONUNBUFFERED: "1"
          UNIT_DATA_DIR: unitdata
          BASE_END: ${{ inputs.base_end || '2024-12-31' }}
        run: |
          prev=(); [ -f previous/cc-gs-change-log.csv ] && prev=(--previous previous)
          python analysis/behaviour_change.py --base-end "$BASE_END" --out behaviour "${prev[@]}" > /dev/null
          cat behaviour/behaviour-change.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload to the behaviour release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          m=$(date -u +%Y-%m)
          for f in behaviour/*; do cp "$f" "behaviour/$m-$(basename "$f")"; done
          gh release upload behaviour behaviour/* --clobber -R "$GITHUB_REPOSITORY"
