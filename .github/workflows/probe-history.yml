name: Probe ERCOT history

# Manual check of how far back ERCOT's report archive goes and whether the 60-day parsers read
# the older files (pipeline/probe_history.py).  Writes nothing; results are in the run summary.
on:
  pull_request:       # runs on a PR that changes the probe, so the result is on the PR before merge
    paths:
      - pipeline/probe_history.py
      - .github/workflows/probe-history.yml
  workflow_dispatch:
    inputs:
      mode:
        description: "scratch_cop.py mode: list or fetch"
        required: false
        default: "list"
      first_year:
        description: "Earliest year to list the archive for"
        required: false
        default: "2016"
      parse_from:
        description: "Earliest year to download and parse a sample day for"
        required: false
        default: "2019"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements.lock
      - name: Probe the archive
        env:
          ERCOT_API_USERNAME: ${{ secrets.ERCOT_API_USERNAME }}
          ERCOT_API_PASSWORD: ${{ secrets.ERCOT_API_PASSWORD }}
          ERCOT_API_SUBSCRIPTION_KEY: ${{ secrets.ERCOT_API_SUBSCRIPTION_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scratch_cop.py "${{ inputs.mode || 'list' }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: cop
          path: cop.json.gz
          if-no-files-found: ignore
