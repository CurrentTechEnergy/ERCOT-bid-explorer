name: Check the load reports

# Reads a few recent postings of ERCOT's load forecast and actual load reports with
# pipeline/load.py's parsers and prints what they read.  Writes nothing.
on:
  pull_request:       # runs on a PR that changes the parser, so the result is on the PR before merge
    paths:
      - pipeline/load.py
      - .github/workflows/check-load.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements.lock
      - name: Parse recent postings
        env:
          ERCOT_API_USERNAME: ${{ secrets.ERCOT_API_USERNAME }}
          ERCOT_API_PASSWORD: ${{ secrets.ERCOT_API_PASSWORD }}
          ERCOT_API_SUBSCRIPTION_KEY: ${{ secrets.ERCOT_API_SUBSCRIPTION_KEY }}
        run: python -m pipeline.load --sample
