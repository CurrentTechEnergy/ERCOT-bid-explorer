name: Keep look-ahead reports

# Keeps ERCOT's 5-minute look-ahead reports (RTD indicative LMPs, the intra-hour wind, solar and
# load forecasts) in the R2 raw store, one bulk zip per report and posting day
# (pipeline/raw_days.py).  Daily, the last 7 complete days of the three forecasts (days already
# stored are skipped); by hand, any span or report (RTD only this way), for the backfill.  Writes nothing to the repository.
on:
  pull_request:       # a PR that changes the job keeps one real day of one forecast, to check the bulk path
    paths:
      - pipeline/raw_days.py
      - .github/workflows/lookahead.yml
  schedule:
    - cron: "47 7 * * *"      # 00:47 Mountain in winter (01:47 in summer), after the previous Central day has posted
  workflow_dispatch:
    inputs:
      emil:
        description: "Reports (comma-separated EMIL ids; blank for the three intra-hour forecasts; np6-970-cd for RTD)"
        required: false
        default: ""
      start:
        description: "First posting day, YYYY-MM-DD (blank: the last 7 days)"
        required: false
        default: ""
      end:
        description: "Last posting day, YYYY-MM-DD"
        required: false
        default: ""
      dry_run:
        description: "Only count what is stored; download nothing"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: lookahead
  cancel-in-progress: false

jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements.lock
      - name: Keep the days not yet stored
        env:
          ERCOT_API_USERNAME: ${{ secrets.ERCOT_API_USERNAME }}
          ERCOT_API_PASSWORD: ${{ secrets.ERCOT_API_PASSWORD }}
          ERCOT_API_SUBSCRIPTION_KEY: ${{ secrets.ERCOT_API_SUBSCRIPTION_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          EMIL: ${{ inputs.emil }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          args=()
          [ -n "$EMIL" ] && args+=(--emil "$EMIL")
          if [ "${{ github.event_name }}" = "pull_request" ]; then args=(--emil np4-751-cd --days 1)
          elif [ -n "$START" ]; then args+=(--start "$START" --end "${END:-$START}"); else args+=(--days 7); fi
          python -m pipeline.raw_days "${args[@]}" $DRY
