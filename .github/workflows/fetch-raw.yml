name: Fetch raw files to the store

# One-time fill of the R2 raw store (pipeline/raw_fetch.py) with a report's files, one job
# per year, one at a time.  Files already in the bucket are never downloaded again; a file that
# can't be stored stops the run.  Run first with dry_run to see how many are already stored.
on:
  workflow_dispatch:
    inputs:
      emil:
        description: "Report (EMIL id)"
        required: false
        default: "np3-966-er"
      lag:
        description: "Days from operating day to posting (60 for the 60-day reports, -1 for day-ahead ones)"
        required: false
        default: "60"
      first_year:
        description: "First operating year"
        required: false
        default: "2019"
      last_year:
        description: "Last operating year"
        required: false
        default: "2025"
      max_files:
        description: "Stop each year after fetching this many files (0: no limit)"
        required: false
        default: "0"
      dry_run:
        description: "Only count what is stored; download nothing"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: fetch-raw
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      years: ${{ steps.plan.outputs.years }}
    steps:
      - id: plan
        env:
          FIRST: ${{ inputs.first_year }}
          LAST: ${{ inputs.last_year }}
        run: python3 -c "import json, os; print('years=' + json.dumps([str(y) for y in range(int(os.environ['FIRST']), int(os.environ['LAST']) + 1)]))" >> "$GITHUB_OUTPUT"
  fetch:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        year: ${{ fromJSON(needs.plan.outputs.years) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements.lock
      - name: Fetch ${{ matrix.year }}
        env:
          ERCOT_API_USERNAME: ${{ secrets.ERCOT_API_USERNAME }}
          ERCOT_API_PASSWORD: ${{ secrets.ERCOT_API_PASSWORD }}
          ERCOT_API_SUBSCRIPTION_KEY: ${{ secrets.ERCOT_API_SUBSCRIPTION_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          EMIL: ${{ inputs.emil }}
          YEAR: ${{ matrix.year }}
          LAG: ${{ inputs.lag }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
          MAX: ${{ inputs.max_files || '0' }}
        run: python -m pipeline.raw_fetch --emil "$EMIL" --lag "$LAG" --start "$YEAR-01-01" --end "$YEAR-12-31" --max-files "$MAX" $DRY
