name: Update ERCOT data

on:
  schedule:
    # ERCOT posts the 2-day curves around 04:15 and the 60-day disclosure around 05:45 Central;
    # the day-ahead market results (tomorrow's node prices) by 13:30 Central.
    - cron: "41 12 * * *"   # ~07:41 Central
    - cron: "31 19 * * *"   # 14:31 Central in summer, 13:31 in winter: after the DAM posts, and the
                            # retry in case a morning report posted late
  workflow_dispatch:
    inputs:
      backfill_start:
        description: "Backfill from operating day (YYYY-MM-DD). Leave blank for a normal update."
        required: false
      backfill_end:
        description: "Backfill to operating day (YYYY-MM-DD)"
        required: false
      max_files:
        description: "Max report files per report type in this run (backfill only)"
        required: false
        default: "60"
      reprocess_60d:
        description: "Re-download and reparse 60-day SCED and DAM days already loaded whose file is missing or predates the current format (max_files per run; queues the next run until done)"
        type: boolean
        required: false
        default: false
      reprocess_store_only:
        description: "With reprocess: read the files only from the raw store (R2), never from ERCOT. Days whose file is not in the store are left for later"
        type: boolean
        required: false
        default: true
      outages_start:
        description: "Also fetch ERCOT's outage reports from operating day (YYYY-MM-DD); with a normal update"
        required: false
      outages_end:
        description: "Outage reports to operating day (YYYY-MM-DD)"
        required: false
      ignore_checks:
        description: "Commit the data even if an accuracy check fails (see the run summary for what failed)"
        type: boolean
        required: false
        default: false
      mis_docs:
        description: "Instead of the API's report fetch, download these report files from ERCOT's website (MIS document ids, space separated), for days the API doesn't serve"
        required: false
      rebuild_all:
        description: "Rerun every builder, even those whose inputs are unchanged since the last build (pipeline/memo.py)"
        type: boolean
        required: false
        default: false

# Each job gets only what it needs; nothing by default.
permissions: {}

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      actions: write     # a reprocess run queues the next one
      contents: write    # the data commit and the data branch
      issues: write      # the stale-data issue (pipeline/freshness.py)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The branch tip, not the commit that triggered the run: a run queued behind another
          # in the update-data group would otherwise start from data the earlier run replaced,
          # and its rebase of the generated files would conflict.
          ref: ${{ github.ref_name }}
          fetch-depth: 1     # main's history is fetched just before the data commit is rebased

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install --require-hashes -r requirements.lock

      # Per-unit day files (full-fidelity status / limits / offer curves, see pipeline/units.py)
      # live on the orphan `data` branch, checked out as a worktree in unitdata/ (gitignored on
      # main) so they never bloat main or the Pages site.
      # Every file on it is regenerable from ERCOT's reports, so the branch is ONE commit, replaced
      # by each run (see "Commit per-unit data" below): old copies of the files never pile up in
      # the repository.  Only that commit is fetched.
      - name: Check out the data branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --depth 1 origin data
            echo "DATA_BASE=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"   # the push below replaces only this commit
            git worktree add -B data unitdata FETCH_HEAD
          else
            echo "No data branch yet: creating it as an orphan"
            git worktree add --detach unitdata
            cd unitdata
            git switch --orphan data
            printf '%s\n' \
              "# Per-unit ERCOT 60-day data" "" \
              "Generated by the Update ERCOT data workflow from main (pipeline/units.py documents the format)." \
              "60d/YYYY-MM-DD.json.gz: every unit's status, limits and submitted offer curve at every SCED run," \
              "stored as change-of-value events. nodes/YYYY-MM-DD.json.gz: hourly resource-node prices." \
              "Everything here is regenerable; history may be squashed." > README.md
            git add README.md
            git commit -m "Start the data branch"
          fi

      # The thermal months, day-ahead hub prices and DAM resource status on the `history` release (pipeline/history.py),
      # gitignored in history/: the forecast's boosted trees add them to their training rows, and
      # the operator-informed model judges the days before the 60-day window on them
      # (pipeline/models/operator_history.py).  Optional: both run without them.
      - name: Fetch the thermal history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download history -R "$GITHUB_REPOSITORY" -p 'thermal-*.parquet' -p 'da-hubs-*.parquet' -p 'dam-status-*.parquet' -D history \
            || echo "No thermal history, so the trees train on the 60-day window only"

      - name: Fetch and process new reports
        id: fetch
        env:
          PYTHONUNBUFFERED: "1"      # stream log lines as they happen
          ERCOT_API_USERNAME: ${{ secrets.ERCOT_API_USERNAME }}
          ERCOT_API_PASSWORD: ${{ secrets.ERCOT_API_PASSWORD }}
          ERCOT_API_SUBSCRIPTION_KEY: ${{ secrets.ERCOT_API_SUBSCRIPTION_KEY }}
          # our own copy of every ERCOT file downloaded (pipeline/raw_store.py); optional
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          OILPRICEAPI_KEY: ${{ secrets.OILPRICEAPI_KEY }}
          BACKFILL_START: ${{ github.event.inputs.backfill_start }}
          BACKFILL_END: ${{ github.event.inputs.backfill_end }}
          MAX_FILES: ${{ github.event.inputs.max_files }}
          REPROCESS_60D: ${{ github.event.inputs.reprocess_60d }}
          STORE_ONLY: ${{ github.event.inputs.reprocess_store_only }}
          OUTAGES_START: ${{ github.event.inputs.outages_start }}
          OUTAGES_END: ${{ github.event.inputs.outages_end }}
          UNIT_DATA_DIR: unitdata
          REBUILD_ALL: ${{ github.event.inputs.rebuild_all == 'true' && '1' || '' }}
          MIS_DOCS: ${{ github.event.inputs.mis_docs }}
        run: |
          if [ -n "$MIS_DOCS" ]; then
            # ids only: digits and spaces
            [[ "$MIS_DOCS" =~ ^[0-9\ ]+$ ]] || { echo "::error::mis_docs takes document ids separated by spaces"; exit 1; }
            python -m pipeline.update --mis-docs $MIS_DOCS
          elif [ "$REPROCESS_60D" = "true" ]; then
            python -m pipeline.update --reprocess-60d --max-files "${MAX_FILES:-60}" $([ "$STORE_ONLY" != "false" ] && echo --store-only)
          elif [ -n "$BACKFILL_START" ]; then
            python -m pipeline.update --backfill "$BACKFILL_START" "${BACKFILL_END:-$BACKFILL_START}" --max-files "${MAX_FILES:-60}"
          elif [ -n "$OUTAGES_START" ]; then
            python -m pipeline.update --outages-backfill "$OUTAGES_START" "${OUTAGES_END:-$OUTAGES_START}"
          else
            python -m pipeline.update
          fi

      # Compares each new or changed day with ERCOT's own aggregates and checks it for internal
      # consistency (pipeline/validate.py). An error stops the run here, so nothing is committed;
      # rerun with "ignore_checks" to commit anyway.
      - name: Check accuracy
        env:
          UNIT_DATA_DIR: unitdata
          IGNORE_CHECKS: ${{ github.event.inputs.ignore_checks }}
        run: |
          if [ "$IGNORE_CHECKS" = "true" ]; then
            python -m pipeline.validate --no-fail
          else
            python -m pipeline.validate
          fi

      # Subscriber emails (pipeline/notify.py): once a day, after the afternoon run, one email to
      # each person who follows a unit the update found a change for (follows live in the follow
      # server, worker/). Sends nothing without the RESEND_API_KEY secret or with the
      # NOTIFY_DRY_RUN variable set to 1; the record of what was sent (site/data/notify_sent.json)
      # goes in with the data commit below.
      - name: Send subscriber emails
        if: github.event_name == 'schedule' && github.event.schedule == '31 19 * * *'
        continue-on-error: true     # a failed email must not hold back the data commit or the deploy
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          NOTIFY_DRY_RUN: ${{ vars.NOTIFY_DRY_RUN }}
        run: python -m pipeline.notify

      - name: Commit per-unit data to the data branch
        working-directory: unitdata
        continue-on-error: true     # a failed push here must not hold back the site/data commit
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No new per-unit data"
          else
            # a new root commit (no parent) in place of the old one: the branch keeps one copy of
            # each file, not every version of it
            git reset -q --soft "$(git commit-tree "$(git write-tree)" -m "Per-unit data as of $(date -u +%Y-%m-%d)")"
          fi
          # push the README commit of a newly created branch too; this job is the branch's only
          # writer, and the lease refuses the push if the branch moved since this run fetched it
          for attempt in 1 2 3 4 5; do
            git push --force-with-lease="refs/heads/data:${DATA_BASE}" origin HEAD:refs/heads/data && exit 0
            echo "Push attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          echo "::error::Could not push the data branch after 5 attempts"
          exit 1

      # Is every input still arriving? Fetch failures only warn and keep the stored data, so this
      # compares each input's newest day with its usual lag (pipeline/freshness.py), writes
      # site/data/freshness.json and keeps one "stale-data" issue open while anything is behind.
      # Runs even when an earlier step failed, and never fails the run itself.
      - name: Check data freshness
        if: always() && !inputs.backfill_start && inputs.reprocess_60d != true && !inputs.outages_start && !inputs.mis_docs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python -m pipeline.freshness --issues

      - name: Commit new data
        run: |
          git add site/data site/unit site/sitemap.xml     # share_pages writes the sitemap beside the unit stubs
          if git diff --cached --quiet; then
            echo "No new data"
            exit 0
          fi
          git commit -m "Data update $(date -u +%Y-%m-%d)"
          # Code may have been pushed while this run was working: rebase onto it, then push.
          git fetch --unshallow origin "${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Push attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          echo "::error::Could not push the data commit after 5 attempts"
          exit 1

      # A reprocess run does max_files files; while days are left (and this run got through some),
      # it queues the next one, so one click fills a format change in.  Cancel a queued run to stop.
      - name: Queue the next reprocess run
        if: steps.fetch.outputs.reprocess_more == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_FILES: ${{ github.event.inputs.max_files }}
          IGNORE_CHECKS: ${{ github.event.inputs.ignore_checks }}
          STORE_ONLY: ${{ github.event.inputs.reprocess_store_only }}
        run: |
          gh workflow run update.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f reprocess_60d=true -f max_files="${MAX_FILES:-60}" -f ignore_checks="${IGNORE_CHECKS:-false}" \
            -f reprocess_store_only="${STORE_ONLY:-true}"

  # Publishing to GitHub Pages is optional: set the repository variable ENABLE_PAGES=true
  # (Settings > Secrets and variables > Actions > Variables) and set Pages source to "GitHub Actions".
  deploy:
    needs: update
    if: vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.ref_name }}     # include the data commit made by the update job
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
