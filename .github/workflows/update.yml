name: Update ERCOT data
# Each run is named after its slot, "Update ERCOT data (morning)" or "(afternoon)": the update
# watchdog (worker/src/watchdog.js) and the "when" job below tell from the name which slot a run did.
run-name: "Update ERCOT data${{ inputs.slot && format(' ({0})', inputs.slot) || github.event.schedule == '31 19 * * *' && ' (afternoon)' || github.event.schedule && ' (morning)' || '' }}"

on:
  # The update watchdog in the follow server's Cloudflare Worker (worker/src/watchdog.js) starts the
  # two daily runs on time, with a slot input: GitHub starts scheduled runs late under load,
  # sometimes many hours late or not at all.  These crons are the backup; a run they start skips
  # itself (the "when" job) when another run has done or is doing that slot today.
  # ERCOT posts the 2-day reports around 03:30-04:50 Central and the 60-day SCED and DAM
  # disclosures around 05:20-06:05 Central; the day-ahead market results (tomorrow's node
  # prices) by 13:30 Central.  Cron is in UTC, so these land an hour later in daylight time.
  schedule:
    - cron: "17 12 * * *"   # morning: 06:17 CST / 05:17 MST (07:17 CDT / 06:17 MDT in summer)
    - cron: "31 19 * * *"   # afternoon: 13:31 CST / 12:31 MST (14:31 CDT / 13:31 MDT): after the DAM
                            # posts, and the retry for any morning report posted late
  workflow_dispatch:
    inputs:
      slot:
        description: "morning or afternoon for a daily update (the watchdog sets it; the afternoon one sends subscriber emails). Leave blank otherwise"
        required: false
      backfill_start:
        description: "Backfill from operating day (YYYY-MM-DD). Leave blank for a normal update."
        required: false
      backfill_end:
        description: "Backfill to operating day (YYYY-MM-DD)"
        required: false
      max_files:
        description: "Max report files per report type in this run (backfill only)"
        required: false
        default: "60"
      reprocess_60d:
        description: "Re-download and reparse 60-day SCED and DAM days already loaded whose file is missing or predates the current format (max_files per run; queues the next run until done)"
        type: boolean
        required: false
        default: false
      reprocess_store_only:
        description: "With reprocess: read the files only from the raw store (R2), never from ERCOT. Days whose file is not in the store are left for later"
        type: boolean
        required: false
        default: true
      outages_start:
        description: "Also fetch ERCOT's outage reports from operating day (YYYY-MM-DD); with a normal update"
        required: false
      outages_end:
        description: "Outage reports to operating day (YYYY-MM-DD)"
        required: false
      ignore_checks:
        description: "Commit the data even if an accuracy check fails (see the run summary for what failed)"
        type: boolean
        required: false
        default: false
      mis_docs:
        description: "Instead of the API's report fetch, download these report files from ERCOT's website (MIS document ids, space separated), for days the API doesn't serve"
        required: false
      refill_prices:
        description: "Instead of the API's report fetch, refill gaps in these days' real-time and day-ahead hub prices (YYYY-MM-DD, space separated): the raw store first, then the ERCOT API, then ERCOT's website"
        required: false
      rebuild_all:
        description: "Rerun every builder, even those whose inputs are unchanged since the last build (pipeline/memo.py)"
        type: boolean
        required: false
        default: false
      publish_held:
        description: "Publish the data a run held back on the held-data branch when its accuracy check failed: check it again with the current code and, if it passes, commit it and deploy. Fetches nothing"
        type: boolean
        required: false
        default: false

# Each job gets only what it needs; nothing by default.
permissions: {}

jobs:
  # Which daily slot this run is (morning, afternoon, or none for a backfill or other manual run),
  # and whether to run it: a slot run is skipped when another run's update job has already done that
  # slot today (Central), or when an earlier run of the slot is still going.
  when:
    runs-on: ubuntu-latest
    permissions:
      actions: read      # this workflow's runs today
    outputs:
      run: ${{ steps.check.outputs.run }}
      slot: ${{ steps.check.outputs.slot }}
    steps:
      - id: check
        env:
          SCHEDULE: ${{ github.event.schedule }}
          SLOT: ${{ inputs.slot }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          case "$SCHEDULE" in
            "31 19 * * *") SLOT=afternoon ;;
            ?*) SLOT=morning ;;
          esac
          case "$SLOT" in
            ""|morning|afternoon) ;;
            *) echo "::error::slot is morning, afternoon or blank, not '$SLOT'"; exit 1 ;;
          esac
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          if [ -z "$SLOT" ]; then echo "Not a daily slot run: run=true"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(date -u -d '2 days ago' +%F)
          gh api "repos/$REPO/actions/workflows/update.yml/runs?per_page=100&created=%3E%3D$since" > runs.json
          export SLOT
          python3 - > verdict <<'PY'
          import json, os, subprocess
          from datetime import datetime
          from zoneinfo import ZoneInfo
          central = ZoneInfo("America/Chicago")
          slot, me, repo = os.environ["SLOT"], int(os.environ["RUN_ID"]), os.environ["REPO"]
          today = datetime.now(central).date()
          day = lambda t: datetime.fromisoformat(t.replace("Z", "+00:00")).astimezone(central).date()
          for r in json.load(open("runs.json"))["workflow_runs"]:
              if r["id"] == me or r["display_title"] != f"Update ERCOT data ({slot})" or day(r["created_at"]) != today:
                  continue
              if r["status"] != "completed" and r["id"] < me:
                  print(f"skip: run {r['id']} of the {slot} slot is still going ({r['html_url']})"); break
              if r["conclusion"] == "success":
                  jobs = json.loads(subprocess.check_output(["gh", "api", f"repos/{repo}/actions/runs/{r['id']}/jobs"]))["jobs"]
                  if any(j["name"] == "update" and j["conclusion"] == "success" for j in jobs):
                      print(f"skip: run {r['id']} already did the {slot} update today ({r['html_url']})"); break
          else:
              print(f"run: no run has done the {slot} update today")
          PY
          cat verdict
          case "$(cat verdict)" in skip:*) run=false ;; *) run=true ;; esac
          echo "run=$run" >> "$GITHUB_OUTPUT"
          { echo "### $(cat verdict)"; } >> "$GITHUB_STEP_SUMMARY"

  update:
    needs: when
    if: needs.when.outputs.run == 'true'
    # On the job, not the workflow, so a skipped morning run never takes the one pending slot
    # from a queued run (a reprocess run's successor, say).
    concurrency:
      group: update-data
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      actions: write     # a reprocess run queues the next one
      contents: write    # the data commit and the data branch
      issues: write      # the stale-data issue (pipeline/freshness.py)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The branch tip, not the commit that triggered the run: a run queued behind another
          # in the update-data group would otherwise start from data the earlier run replaced,
          # and its rebase of the generated files would conflict.
          ref: ${{ github.ref_name }}
          fetch-depth: 1     # main's history is fetched just before the data commit is rebased

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install --require-hashes -r requirements.lock

      # Per-unit day files (full-fidelity status / limits / offer curves, see pipeline/units.py)
      # live on the orphan `data` branch, checked out as a worktree in unitdata/ (gitignored on
      # main) so they never bloat main or the Pages site.
      # Every file on it is regenerable from ERCOT's reports, so the branch is ONE commit, replaced
      # by each run (see "Commit per-unit data" below): old copies of the files never pile up in
      # the repository.  Only that commit is fetched.
      - name: Check out the data branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --depth 1 origin data
            echo "DATA_BASE=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"   # the push below replaces only this commit
            git worktree add -B data unitdata FETCH_HEAD
          else
            echo "No data branch yet: creating it as an orphan"
            git worktree add --detach unitdata
            cd unitdata
            git switch --orphan data
            printf '%s\n' \
              "# Per-unit ERCOT 60-day data" "" \
              "Generated by the Update ERCOT data workflow from main (pipeline/units.py documents the format)." \
              "60d/YYYY-MM-DD.json.gz: every unit's status, limits and submitted offer curve at every SCED run," \
              "stored as change-of-value events. nodes/YYYY-MM-DD.json.gz: hourly resource-node prices." \
              "Everything here is regenerable; history may be squashed." > README.md
            git add README.md
            git commit -m "Start the data branch"
          fi

      # The thermal months, day-ahead hub prices and system lambda, DAM resource status and QSE/DME months on the `history` release (pipeline/history.py),
      # gitignored in history/: the operator-informed model judges the days before the 60-day window on them
      # (pipeline/models/operator_history.py), and qse.py merges the QSE/DME months into the unit
      # histories once each.  Optional: all run without them.
      - name: Fetch the thermal history
        if: inputs.publish_held != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download history -R "$GITHUB_REPOSITORY" -p 'thermal-*.parquet' -p 'da-hubs-*.parquet' -p 'da-lambda-*.parquet' -p 'dam-status-*.parquet' -p 'control-*.parquet' -D history \
            || echo "No thermal history, so the operator model skips the days before the 60-day window"

      # The thermal history parsed for the operator model (operator_history._parsed): about 10
      # minutes of pandas grouping a run otherwise, redone only when the history files or the
      # pipeline code change.  The key changes with them; an older cache is restored, found stale
      # by its own key and parsed again.
      - name: Restore the parsed thermal history
        if: inputs.publish_held != true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: history/parsed.pkl
          key: history-parsed-${{ hashFiles('history/thermal-*.parquet', 'history/dam-status-*.parquet', 'pipeline/**/*.py') }}
          restore-keys: history-parsed-

      - name: Fetch and process new reports
        id: fetch
        if: inputs.publish_held != true
        env:
          PYTHONUNBUFFERED: "1"      # stream log lines as they happen
          ERCOT_API_USERNAME: ${{ secrets.ERCOT_API_USERNAME }}
          ERCOT_API_PASSWORD: ${{ secrets.ERCOT_API_PASSWORD }}
          ERCOT_API_SUBSCRIPTION_KEY: ${{ secrets.ERCOT_API_SUBSCRIPTION_KEY }}
          # our own copy of every ERCOT file downloaded (pipeline/raw_store.py); optional
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          OILPRICEAPI_KEY: ${{ secrets.OILPRICEAPI_KEY }}
          # the wind and solar months on the history release (pipeline/renew_years.py)
          GH_TOKEN: ${{ github.token }}
          BACKFILL_START: ${{ github.event.inputs.backfill_start }}
          BACKFILL_END: ${{ github.event.inputs.backfill_end }}
          MAX_FILES: ${{ github.event.inputs.max_files }}
          REPROCESS_60D: ${{ github.event.inputs.reprocess_60d }}
          STORE_ONLY: ${{ github.event.inputs.reprocess_store_only }}
          OUTAGES_START: ${{ github.event.inputs.outages_start }}
          OUTAGES_END: ${{ github.event.inputs.outages_end }}
          UNIT_DATA_DIR: unitdata
          REBUILD_ALL: ${{ github.event.inputs.rebuild_all == 'true' && '1' || '' }}
          MIS_DOCS: ${{ github.event.inputs.mis_docs }}
          REFILL_PRICES: ${{ github.event.inputs.refill_prices }}
        run: |
          if [ -n "$MIS_DOCS" ]; then
            # ids only: digits and spaces
            [[ "$MIS_DOCS" =~ ^[0-9\ ]+$ ]] || { echo "::error::mis_docs takes document ids separated by spaces"; exit 1; }
            python -m pipeline.update --mis-docs $MIS_DOCS
          elif [ -n "$REFILL_PRICES" ]; then
            [[ "$REFILL_PRICES" =~ ^[0-9\ -]+$ ]] || { echo "::error::refill_prices takes dates (YYYY-MM-DD) separated by spaces"; exit 1; }
            python -m pipeline.update --refill-prices $REFILL_PRICES
          elif [ "$REPROCESS_60D" = "true" ]; then
            python -m pipeline.update --reprocess-60d --max-files "${MAX_FILES:-60}" $([ "$STORE_ONLY" != "false" ] && echo --store-only)
          elif [ -n "$BACKFILL_START" ]; then
            python -m pipeline.update --backfill "$BACKFILL_START" "${BACKFILL_END:-$BACKFILL_START}" --max-files "${MAX_FILES:-60}"
          elif [ -n "$OUTAGES_START" ]; then
            python -m pipeline.update --outages-backfill "$OUTAGES_START" "${OUTAGES_END:-$OUTAGES_START}"
          else
            python -m pipeline.update
          fi

      # publish_held: the held run's data commit (see "Commit new data") applied on top of the branch
      # as it is now.  A file the branch has changed since keeps the branch's version.
      - name: Bring in the held data
        if: inputs.publish_held == true
        run: |
          git fetch --depth 2 origin held-data || { echo "::error::No held-data branch: nothing is held"; exit 1; }
          held=$(git rev-parse FETCH_HEAD)
          git fetch --unshallow origin "${GITHUB_REF_NAME}" 2>/dev/null || true     # the merge base, for the 3-way apply
          if ! git cherry-pick -n "$held"; then
            for f in $(git diff --name-only --diff-filter=U); do
              echo "::warning::$f changed on ${GITHUB_REF_NAME} since the held run: kept that version"
              git checkout HEAD -- "$f" 2>/dev/null || git rm -q -f -- "$f"
            done
          fi
          git reset -q        # leave the files in the work tree; "Commit new data" adds them
          echo "Held data from $(git log -1 --format='%s (%h)' "$held")"

      # Compares each new or changed day with ERCOT's own aggregates and checks it for internal
      # consistency (pipeline/validate.py). An error fails the run, but its work is kept: the
      # per-unit data and the builders' caches still go to the data branch, and the site data goes
      # to the held-data branch instead of the live branch (see "Commit new data"), so after a fix a
      # "publish_held" run checks it again and publishes it without reprocessing anything.  Rerun
      # with "ignore_checks" to commit straight away instead.
      - name: Check accuracy
        id: check
        continue-on-error: true     # the last step fails the run; the steps between keep the work
        env:
          UNIT_DATA_DIR: unitdata
          IGNORE_CHECKS: ${{ github.event.inputs.ignore_checks }}
        run: |
          if [ "$IGNORE_CHECKS" = "true" ]; then
            python -m pipeline.validate --no-fail
          else
            python -m pipeline.validate
          fi

      # Subscriber emails (pipeline/notify.py): once a day, after the afternoon run, one email to
      # each person who follows a unit the update found a change for (follows live in the follow
      # server, worker/). Sends nothing without the RESEND_API_KEY secret or with the
      # NOTIFY_DRY_RUN variable set to 1; the record of what was sent (site/data/notify_sent.json)
      # goes in with the data commit below.
      - name: Send subscriber emails
        if: needs.when.outputs.slot == 'afternoon' && steps.check.outcome == 'success'
        continue-on-error: true     # a failed email must not hold back the data commit or the deploy
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          NOTIFY_DRY_RUN: ${{ vars.NOTIFY_DRY_RUN }}
        run: python -m pipeline.notify

      - name: Commit per-unit data to the data branch
        if: inputs.publish_held != true     # a publish run leaves the data branch as the held run left it
        working-directory: unitdata
        continue-on-error: true     # a failed push here must not hold back the site/data commit
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No new per-unit data"
          else
            # a new root commit (no parent) in place of the old one: the branch keeps one copy of
            # each file, not every version of it
            git reset -q --soft "$(git commit-tree "$(git write-tree)" -m "Per-unit data as of $(date -u +%Y-%m-%d)")"
          fi
          # push the README commit of a newly created branch too; this job is the branch's only
          # writer, and the lease refuses the push if the branch moved since this run fetched it
          for attempt in 1 2 3 4 5; do
            git push --force-with-lease="refs/heads/data:${DATA_BASE}" origin HEAD:refs/heads/data && exit 0
            echo "Push attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          echo "::error::Could not push the data branch after 5 attempts"
          exit 1

      # Is every input still arriving? Fetch failures only warn and keep the stored data, so this
      # compares each input's newest day with its usual lag (pipeline/freshness.py), writes
      # site/data/freshness.json and keeps one "stale-data" issue open while anything is behind.
      # Runs even when an earlier step failed, and never fails the run itself.
      - name: Check data freshness
        if: always() && !inputs.backfill_start && inputs.reprocess_60d != true && !inputs.outages_start && !inputs.mis_docs && !inputs.refill_prices && inputs.publish_held != true
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python -m pipeline.freshness --issues

      # Passed: the data goes to the live branch, and any held data is dropped (this run's is newer).
      # Failed: it goes to the held-data branch, one commit on the branch as this run found it, for a
      # publish_held run to bring in after a fix.  Either way nothing this run built is thrown away.
      - name: Commit new data
        if: steps.fetch.outcome == 'success' || steps.fetch.outcome == 'skipped'
        env:
          CHECK: ${{ steps.check.outcome }}
          PUBLISH: ${{ inputs.publish_held }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$CHECK" != "success" ]; then
            # held data goes without the failed check's record, so publish_held checks those days
            # again and counts their errors as new (validate.py lets known errors through)
            git checkout HEAD -- site/data/validation.json 2>/dev/null || true
          fi
          git add site/data site/unit site/sitemap.xml     # share_pages writes the sitemap beside the unit stubs
          if git diff --cached --quiet; then
            echo "No new data"
          elif [ "$CHECK" = "success" ]; then
            git commit -m "Data update $(date -u +%Y-%m-%d)"
            # Code may have been merged while this run was working: rebase onto it, then push.  A data
            # file the merge changed too keeps the merged version (see the script).
            .github/scripts/push-data.sh "${GITHUB_REF_NAME}"
          else
            if [ "$PUBLISH" = "true" ]; then
              echo "::error::The held data still fails the accuracy check; it stays on held-data"
              exit 0
            fi
            git commit -m "Held data update $(date -u +%Y-%m-%d): accuracy check failed, $RUN_URL"
            git push -f origin "HEAD:refs/heads/held-data"
            echo "::warning::Accuracy check failed: the site data is held on the held-data branch. After a fix, run this workflow with publish_held to check and publish it."
            { echo "### Data held back"; echo; echo "The accuracy check failed, so this run's site data is on the **held-data** branch, not live. The per-unit data and caches were saved. After a fix, run *Update ERCOT data* with **publish_held** to check it again and publish it without reprocessing."; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # passed and published: drop any held data (this run's is newer, or it was the held data itself)
          if [ "$CHECK" = "success" ] && git ls-remote --exit-code --heads origin held-data > /dev/null; then
            git push origin --delete held-data || echo "::warning::Could not delete the held-data branch"
          fi

      # The run fails here, after the work above is saved, when the accuracy check failed; the
      # deploy job then does not run.
      - name: Fail on the accuracy check
        if: steps.check.outcome == 'failure'
        run: |
          echo "::error::The accuracy check failed (see its step and the run summary); the data is held, not published"
          exit 1

      # A reprocess run does max_files files; while days are left (and this run got through some),
      # it queues the next one, so one click fills a format change in.  Cancel a queued run to stop.
      - name: Queue the next reprocess run
        if: steps.fetch.outputs.reprocess_more == 'true' && steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_FILES: ${{ github.event.inputs.max_files }}
          IGNORE_CHECKS: ${{ github.event.inputs.ignore_checks }}
          STORE_ONLY: ${{ github.event.inputs.reprocess_store_only }}
        run: |
          gh workflow run update.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f reprocess_60d=true -f max_files="${MAX_FILES:-60}" -f ignore_checks="${IGNORE_CHECKS:-false}" \
            -f reprocess_store_only="${STORE_ONLY:-true}"

  # Publishing to GitHub Pages is optional: set the repository variable ENABLE_PAGES=true
  # (Settings > Secrets and variables > Actions > Variables) and set Pages source to "GitHub Actions".
  deploy:
    needs: update
    if: vars.ENABLE_PAGES == 'true'
    concurrency:
      group: pages-deploy     # shared with renew-history.yml: one Pages deploy at a time
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.ref_name }}     # include the data commit made by the update job
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      # In place of actions/deploy-pages, which caps its wait at 10 minutes and reuses a cancelled
      # deployment when two runs start from the same commit (see the script).  If this times out,
      # "Re-run failed jobs" redeploys without redoing the update.
      - id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/deploy-pages.sh "${{ steps.upload.outputs.artifact_id }}"
