name: Archive offer stack

# One day's aggregated offer stack by technology from ERCOT's archive (pipeline/archive_stack.py),
# for reference charts such as an older, pre-battery offer curve.  Writes only a run artifact:
# never commits and never touches data/ or the data branch.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Operating days, space separated (YYYY-MM-DD)"
        required: true
        default: "2019-08-13 2019-08-15"
  pull_request:       # runs on a PR that changes it, so the default days are on the PR
    paths:
      - pipeline/archive_stack.py
      - .github/workflows/archive-stack.yml

permissions:
  contents: read

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build the stacks
        env:
          ERCOT_API_USERNAME: ${{ secrets.ERCOT_API_USERNAME }}
          ERCOT_API_PASSWORD: ${{ secrets.ERCOT_API_PASSWORD }}
          ERCOT_API_SUBSCRIPTION_KEY: ${{ secrets.ERCOT_API_SUBSCRIPTION_KEY }}
          DAYS: ${{ inputs.days || '2019-08-13 2019-08-15' }}
        run: python -m pipeline.archive_stack $DAYS --out archive-stack
      - uses: actions/upload-artifact@v4
        with:
          name: archive-stack
          path: archive-stack/
