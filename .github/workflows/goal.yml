name: Goal page

# The "Will fossil turn off?" page's data (pipeline/goal.py): four questions answered by year from
# Jan 2019, from the 60-day data alone (the data branch, the history release, and main's operator
# day files).  Writes site/data/goal.json.gz (and the Prices page's past years, prices_years_hist.json.gz)
# and commits them to main.  Only those files are committed,
# so it needs no slot in the update's concurrency group; the push rebases onto whatever the update
# wrote meanwhile.
on:
  schedule:
    - cron: "23 8 * * 0"      # Sundays 08:23 UTC (01:23 MST / 02:23 MDT): the 05:17 MT update deploys it
  workflow_dispatch:

permissions:
  contents: write     # the goal.json.gz commit

concurrency:
  group: goal
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements.lock
      - name: Inputs (the data branch, the history release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --depth 1 origin data && git worktree add --detach unitdata FETCH_HEAD
          gh release download history -R "$GITHUB_REPOSITORY" -p 'thermal-*.parquet' -p 'units-*.parquet' \
            -p 'da-hubs-*.parquet' -p 'da-lambda-*.parquet' -p 'rt-prices-*.parquet' -p 'dam-status-*.parquet' -D history
      - name: Build
        env:
          PYTHONUNBUFFERED: "1"
          UNIT_DATA_DIR: unitdata
          # read-only use: the licensed hub gas prices (pipeline/private.py) for the gas cost at minimum
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m pipeline.goal --cache goal-cache
      # the Prices page's past years into prices_years_hist.json.gz: the real-time months are only
      # downloaded here.  It moves the "same months" cut; the update run adds the latest year on top.
      - name: Prices page, every year
        continue-on-error: true     # never holds back the goal page's commit
        env:
          PYTHONUNBUFFERED: "1"
          UNIT_DATA_DIR: unitdata
        run: python -m pipeline.prices_years --full
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/goal.json.gz site/data/prices_years_hist.json.gz
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Goal page data $(date -u +%Y-%m-%d)"
          git fetch --unshallow origin main
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          echo "::error::Could not push the goal commit after 5 attempts"
          exit 1
