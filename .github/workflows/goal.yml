name: Goal page

# The "Will fossil turn off?" page's data (pipeline/goal.py): four questions answered by year from
# Jan 2019, from the 60-day data alone (the data branch, the history release, and main's operator
# day files).  Writes site/data/goal.json.gz and commits it to main.  Only that file is committed,
# so it needs no slot in the update's concurrency group; the push rebases onto whatever the update
# wrote meanwhile.
on:
  schedule:
    - cron: "23 16 4 * *"     # the 4th of each month, between the update's two runs
  workflow_dispatch:

permissions:
  contents: write     # the goal.json.gz commit

concurrency:
  group: goal
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements.lock
      - name: Inputs (the data branch, the history release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --depth 1 origin data && git worktree add --detach unitdata FETCH_HEAD
          gh release download history -R "$GITHUB_REPOSITORY" -p 'thermal-*.parquet' -p 'units-*.parquet' \
            -p 'da-hubs-*.parquet' -p 'da-lambda-*.parquet' -p 'rt-prices-*.parquet' -p 'dam-status-*.parquet' -D history
      - name: Build
        env:
          PYTHONUNBUFFERED: "1"
          UNIT_DATA_DIR: unitdata
          # read-only use: the licensed hub gas prices (pipeline/private.py) for the gas cost at minimum
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m pipeline.goal --cache goal-cache
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/goal.json.gz
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Goal page data $(date -u +%Y-%m-%d)"
          git fetch --unshallow origin main
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          echo "::error::Could not push the goal commit after 5 attempts"
          exit 1
