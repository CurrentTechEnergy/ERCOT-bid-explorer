name: Goal page

# The "Will fossil turn off?" page's data (pipeline/goal.py): four questions answered by year from
# Jan 2019, from the 60-day data alone (the data branch, the history release, and main's operator
# day files).  Writes site/data/goal.json.gz (and the Prices page's past years, prices_years_hist.json.gz,
# and the Turn-ons and Turn-offs page's daily floor history, lsl_floor_hist.json.gz) and commits them
# to main.  Only those files are committed,
# so it needs no slot in the update's concurrency group; the push rebases onto whatever the update
# wrote meanwhile.
# Started by the Update ERCOT data run whenever it adds a new 60-day day ("Start the Goal page
# run" there), so the page follows each day in; the next update deploys it (the afternoon one, for
# a day the morning run brought).  Run it by hand after a change to its code.
on:
  workflow_dispatch:

permissions:
  contents: write     # the goal.json.gz commit

concurrency:
  group: goal
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements.lock
      - name: Inputs (the data branch, the history release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --depth 1 origin data && git worktree add --detach unitdata FETCH_HEAD
          gh release download history -R "$GITHUB_REPOSITORY" -p 'thermal-*.parquet' -p 'units-*.parquet' \
            -p 'da-hubs-*.parquet' -p 'da-lambda-*.parquet' -p 'rt-prices-*.parquet' -p 'dam-status-*.parquet' \
            -p 'as-*.parquet' -p 'rt-mcpc-*.parquet' -D history
      # The months the history release lacks, built from the day files (decision_table.month_file),
      # kept between runs: about a minute each otherwise.  Each month carries a fingerprint of its
      # day files and row code, so a new or corrected day rebuilds only its month.  A new key every
      # run (the cache is immutable) restoring the latest one.
      - name: Restore the months built from the day files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: goal-cache/months
          key: goal-months-${{ github.run_id }}
          restore-keys: goal-months-
      - name: Build
        env:
          PYTHONUNBUFFERED: "1"
          UNIT_DATA_DIR: unitdata
          # read-only use: the licensed hub gas prices (pipeline/private.py) for the gas cost at minimum
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m pipeline.goal --cache goal-cache
      # the Prices page's past years into prices_years_hist.json.gz: the real-time months are only
      # downloaded here.  It moves the "same months" cut; the update run adds the latest year on top.
      - name: Prices page, every year
        continue-on-error: true     # never holds back the goal page's commit
        env:
          PYTHONUNBUFFERED: "1"
          UNIT_DATA_DIR: unitdata
        run: python -m pipeline.prices_years --full
      # the Turn-ons and Turn-offs page's daily minimum floor, 2019 to the last thermal month, into
      # lsl_floor_hist.json.gz; the update run adds the 60-day days on top.
      - name: Daily minimum floor, every day
        continue-on-error: true     # never holds back the goal page's commit
        env:
          PYTHONUNBUFFERED: "1"
        run: python -m pipeline.lsl_floor --full
      # the coal Unit page's year-by-year panel, 2019 to the last thermal month, into
      # coal_years_hist.json.gz; the update run adds the 60-day days on top.
      - name: Coal year by year
        continue-on-error: true     # never holds back the goal page's commit
        env:
          PYTHONUNBUFFERED: "1"
        run: python -m pipeline.coal_years --full
      # the CT Unit page's prices-it-ran-at chart: histograms per unit-year, 2019 to the last thermal
      # month, into ct_years_hist.json.gz; the update run adds the 60-day days on top.
      - name: CT prices by year
        continue-on-error: true     # never holds back the goal page's commit
        env:
          PYTHONUNBUFFERED: "1"
        run: python -m pipeline.ct_years --full
      # the Thermal page's across the years: what each thermal technology earned and spent each day,
      # 2019 to the last thermal month, into thermal_years_hist.json.gz; the update run adds the
      # 60-day days on top.  Reads the private hub gas prices (R2) where it can.
      - name: Thermal across the years
        continue-on-error: true     # never holds back the goal page's commit
        env:
          PYTHONUNBUFFERED: "1"
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m pipeline.thermal_years --full
      # the Renewables page's "What wind and solar earned": each day's wind and solar energy, revenue
      # and curtailment, 2019 to the last real-time month, into renew_earned_hist.json.gz; the update
      # run adds the 60-day days on top.
      - name: Wind and solar earned
        continue-on-error: true     # never holds back the goal page's commit
        env:
          PYTHONUNBUFFERED: "1"
        run: python -m pipeline.renew_earned --full
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/goal.json.gz site/data/prices_years_hist.json.gz site/data/lsl_floor_hist.json.gz site/data/coal_years_hist.json.gz site/data/ct_years_hist.json.gz site/data/thermal_years_hist.json.gz site/data/renew_earned_hist.json.gz
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Goal page data $(date -u +%Y-%m-%d)"
          .github/scripts/push-data.sh main
