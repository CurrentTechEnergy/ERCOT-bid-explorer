name: Fuel hub probe (temporary)
on:
  push:
    branches: [fuel-hub-by-unit]
    paths: [.github/workflows/fuel-hub-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Node prices from the data branch
        run: |
          git fetch --depth 1 --filter=blob:none origin data
          git worktree add --no-checkout unitdata FETCH_HEAD
          cd unitdata && git sparse-checkout set --no-cone '/nodes/*' && git checkout
      - name: Fetch hubs and assign fuel hubs
        env:
          OILPRICEAPI_KEY: ${{ secrets.OILPRICEAPI_KEY }}
          UNIT_DATA_DIR: unitdata
        run: |
          python -c "from pipeline.gas import fetch_hubs; fetch_hubs()"
          python -c "from pipeline.store import load_index; from pipeline.fuel_hub import build_fuel_hubs; build_fuel_hubs(load_index())"
          python - <<'PY'
          import gzip, json
          u = json.load(gzip.open("site/data/fuel_hubs.json.gz"))["units"]
          for n, r in sorted(u.items(), key=lambda kv: (kv[1]["hub"], kv[1]["method"], kv[0])):
              f = {k: (v["n"], v["r2"], v["hr"], v["vote"]) for k, v in r["fits"].items()}
              print(f'{n:22s} {r["tech"][:6]:6s} {r["hub"]:4s} {r["method"]:8s} loc={r["loc"]} {f}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fuel-hubs
          path: |
            site/data/fuel_hubs.json.gz
            site/data/gas_hubs.json.gz
