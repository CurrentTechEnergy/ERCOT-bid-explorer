name: Dart probe (one-off, read-only)

# Downloads ERCOT LMPs by electrical bus (NP6-787-CD) for a handful of past operating days and
# the load distribution factors (NP4-159-CD) around them, reduced to substations, for the
# load-weighted "who is marginal" analysis (tools/dart_probe.py).  Writes a workflow artifact
# only: no commit, no site data.  Runs on pushes to its own branch, never on main, and stays out
# of the update-data concurrency group so it cannot cancel a queued update.
on:
  push:
    branches: [dart-probe]
    paths: [tools/dart_probe.py, .github/workflows/dart-probe.yml]

permissions:
  contents: read

concurrency:
  group: dart-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Settlement point list (public MIS, NP4-160-SG)
        run: |
          id=$(curl -s "https://www.ercot.com/misapp/GetReports.do?reportTypeId=10008" | grep -o 'doclookupId=[0-9]*' | head -1 | cut -d= -f2)
          curl -s -o sp.zip "https://www.ercot.com/misdownload/servlets/mirDownload?doclookupId=$id"
          mkdir -p sp && unzip -o -q sp.zip -d sp
          ls -R sp | head
      - name: Download and reduce
        env:
          ERCOT_API_USERNAME: ${{ secrets.ERCOT_API_USERNAME }}
          ERCOT_API_PASSWORD: ${{ secrets.ERCOT_API_PASSWORD }}
          ERCOT_API_SUBSCRIPTION_KEY: ${{ secrets.ERCOT_API_SUBSCRIPTION_KEY }}
          # single-document downloads (the load distribution factors) are kept in the raw store
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python -m tools.dart_probe "$(find sp -name 'Settlement_Points*.csv' | head -1)" \
            2025-12-02 2025-12-06 2025-12-10 2025-12-14 2025-12-18 2025-12-22 2025-12-26 2025-12-30 2026-01-03 2026-01-07 2026-01-11 2026-01-15 2026-01-19 2026-01-23 2026-01-27 2026-01-31 2026-02-04 2026-02-08 2026-02-12 2026-02-16 2026-02-20 2026-02-24 2026-02-28 2026-03-04 2026-03-08 2026-03-12 2026-03-16 2026-03-20 2026-03-24 2026-03-28 2026-04-01 2026-04-05 2026-04-09 2026-04-13 2026-04-17 2026-04-21 2026-04-25 2026-04-29 2026-05-03 2026-05-07 2026-05-11 2026-05-15 2026-05-19 2026-05-23 2026-05-27 2026-05-31 2026-06-04 2026-06-08 2026-06-12 2026-06-16 2026-06-20 2026-06-24 2026-07-02 2026-07-06 2026-07-10 2026-07-14 2026-07-18 2026-07-22 2026-07-26 2026-08-03
          ls -la out/dart
      - uses: actions/upload-artifact@v4
        with:
          name: dart-probe
          path: out/dart
          retention-days: 14
