name: Backtest

# The forecast backtest (pipeline/forecast/backtest.py) for a branch against main, split across
# machines: each side's days are built in `chunks` parallel jobs, then scored and reported in
# one.  Both sides read the same inputs: main's site/data at the commit main is on when the run
# starts, the data branch and the thermal history release.
#
# Each side's day files are cached by its code (the git tree of pipeline/), the thermal history
# months on the release and the environment it ran with, so a side whose code hasn't changed
# (main's, usually) only builds the days it doesn't have yet.  That relies on each day being
# forecast from what was public the day before it; set `fresh` to rebuild every day when inputs
# for past days have changed (a reprocess of the 60-day files, say).
#
# Results: the report in the run summary, and the `backtest` artifact: report.md, each side's
# run.log, and seed/<side>/ with every day file, which rebuilds the sides locally for analysis/
# without forecasting again (analysis/README.md).
on:
  workflow_dispatch:
    inputs:
      current:
        description: "Branch, tag or commit to test"
        required: true
      against:
        description: "Branch, tag or commit to compare with"
        required: false
        default: main
      current_env:
        description: "Environment for the tested side only, NAME=VALUE pairs (e.g. THERMAL_VARIANT=logit)"
        required: false
        default: ""
      days_start:
        description: "First day (YYYY-MM-DD); blank = every forecast day"
        required: false
      days_end:
        description: "Last day (YYYY-MM-DD)"
        required: false
      chunks:
        description: "Parallel jobs per side"
        required: false
        default: "8"
      fresh:
        description: "Ignore cached days and rebuild every day"
        type: boolean
        required: false
        default: false
  pull_request:       # smoke test on a PR that changes the backtest: two days in two chunks, no cache
    paths:
      - pipeline/forecast/backtest.py
      - .github/workflows/backtest.yml

permissions:
  contents: read

concurrency:
  group: backtest-${{ inputs.current || github.head_ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      data_sha: ${{ steps.plan.outputs.data_sha }}
      current_sha: ${{ steps.plan.outputs.current_sha }}
      ref_sha: ${{ steps.plan.outputs.ref_sha }}
      current_key: ${{ steps.plan.outputs.current_key }}
      ref_key: ${{ steps.plan.outputs.ref_key }}
      chunks: ${{ steps.plan.outputs.chunks }}
      n: ${{ steps.plan.outputs.n }}
      current_name: ${{ steps.plan.outputs.current_name }}
      against_name: ${{ steps.plan.outputs.against_name }}
      days_start: ${{ steps.plan.outputs.days_start }}
      days_end: ${{ steps.plan.outputs.days_end }}
      fresh: ${{ steps.plan.outputs.fresh }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          CURRENT: ${{ inputs.current || github.head_ref }}
          AGAINST: ${{ inputs.against || 'main' }}
          CURRENT_ENV: ${{ inputs.current_env }}
          CHUNKS: ${{ inputs.chunks || '8' }}
          START: ${{ inputs.days_start }}
          END: ${{ inputs.days_end }}
          FRESH: ${{ inputs.fresh || false }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then CHUNKS=2 START=2026-03-01 END=2026-03-02 FRESH=true; fi
          git fetch --depth 1 origin "$CURRENT" && cur=$(git rev-parse FETCH_HEAD)
          git fetch --depth 1 origin "$AGAINST" && ref=$(git rev-parse FETCH_HEAD)
          hist=$(gh release view history -R "$GITHUB_REPOSITORY" --json assets \
                   --jq '[.assets[].name|select(startswith("thermal-"))]|sort|join(" ")' | sha1sum | cut -c1-12)
          key() { echo "backtest-$(git rev-parse "$1:pipeline" | cut -c1-12)-h$hist-e$(printf '%s' "$2" | sha1sum | cut -c1-8)"; }
          {
            echo "data_sha=$(git rev-parse HEAD)"
            echo "current_sha=$cur"
            echo "ref_sha=$ref"
            echo "current_key=$(key "$cur" "$CURRENT_ENV")"
            echo "ref_key=$(key "$ref" "")"
            echo "current_name=$CURRENT"
            echo "against_name=$AGAINST"
            echo "days_start=$START"
            echo "days_end=${END:-$START}"
            echo "fresh=$FRESH"
            echo "n=$CHUNKS"
            echo "chunks=$(python3 -c "import json, sys; print(json.dumps(list(range(int(sys.argv[1])))))" "$CHUNKS")"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        side: [current, ref]
        chunk: ${{ fromJson(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.data_sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Inputs (both sides' code, the data branch, the thermal history)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the harness (pipeline/ outside the sides' trees) is this workflow's own commit; each
          # side's code is taken from its commit by the harness
          git fetch --depth 1 origin "$GITHUB_SHA" ${{ needs.plan.outputs.current_sha }} ${{ needs.plan.outputs.ref_sha }}
          git checkout "$GITHUB_SHA" -- pipeline
          git fetch --depth 1 origin data && git worktree add --detach unitdata FETCH_HEAD
          gh release download history -R "$GITHUB_REPOSITORY" -p 'thermal-*.parquet' -p 'da-hubs-*.parquet' -D history \
            || echo "No thermal history"
      # the cache holds a side's day files under days/ whichever side it was saved from, so a
      # branch's cache serves main's side once the branch is merged
      - name: Restore cached days
        if: needs.plan.outputs.fresh != 'true'
        uses: actions/cache/restore@v4
        with:
          path: days
          key: ${{ matrix.side == 'current' && needs.plan.outputs.current_key || needs.plan.outputs.ref_key }}-none
          restore-keys: ${{ matrix.side == 'current' && needs.plan.outputs.current_key || needs.plan.outputs.ref_key }}-
      - run: mkdir -p seed && if [ -d days ]; then mv days seed/${{ matrix.side }}; fi
      - name: Build chunk ${{ matrix.chunk }} of ${{ matrix.side }}
        env:
          PYTHONUNBUFFERED: "1"
          UNIT_DATA_DIR: unitdata
          SIDE: ${{ matrix.side }}
          CHUNK: ${{ matrix.chunk }}
          N: ${{ needs.plan.outputs.n }}
          CUR: ${{ needs.plan.outputs.current_sha }}
          REF: ${{ needs.plan.outputs.ref_sha }}
          CURRENT_ENV: ${{ inputs.current_env }}
          START: ${{ needs.plan.outputs.days_start }}
          END: ${{ needs.plan.outputs.days_end }}
        run: |
          days=(); [ -n "$START" ] && days=(--days "$START" "${END:-$START}")
          python -m pipeline.forecast.backtest --out bt --side "$SIDE" --chunk "$CHUNK" "$N" --current "$CUR" --against "$REF" \
            --current-env "$CURRENT_ENV" --seed seed --emit emit "${days[@]}"
          tail -n 3 "bt/$SIDE/run.log"
      - uses: actions/upload-artifact@v4
        with:
          name: days-${{ matrix.side }}-${{ matrix.chunk }}
          path: emit/
          if-no-files-found: ignore
          retention-days: 3

  report:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.data_sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Inputs (both sides' code, the data branch, the thermal history)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the harness (pipeline/ outside the sides' trees) is this workflow's own commit; each
          # side's code is taken from its commit by the harness
          git fetch --depth 1 origin "$GITHUB_SHA" ${{ needs.plan.outputs.current_sha }} ${{ needs.plan.outputs.ref_sha }}
          git checkout "$GITHUB_SHA" -- pipeline
          git fetch --depth 1 origin data && git worktree add --detach unitdata FETCH_HEAD
          gh release download history -R "$GITHUB_REPOSITORY" -p 'thermal-*.parquet' -p 'da-hubs-*.parquet' -D history \
            || echo "No thermal history"
      - name: Restore cached days (current)
        if: needs.plan.outputs.fresh != 'true'
        uses: actions/cache/restore@v4
        with:
          path: days
          key: ${{ needs.plan.outputs.current_key }}-none
          restore-keys: ${{ needs.plan.outputs.current_key }}-
      - run: mkdir -p seed && if [ -d days ]; then mv days seed/current; fi
      - name: Restore cached days (ref)
        if: needs.plan.outputs.fresh != 'true'
        uses: actions/cache/restore@v4
        with:
          path: days
          key: ${{ needs.plan.outputs.ref_key }}-none
          restore-keys: ${{ needs.plan.outputs.ref_key }}-
      - run: mkdir -p seed && if [ -d days ]; then mv days seed/ref; fi
      - uses: actions/download-artifact@v4
        continue-on-error: true     # no artifacts when every day came from the cache
        with:
          pattern: days-*
          path: seed
          merge-multiple: true
      - name: Score both sides and write the report
        env:
          PYTHONUNBUFFERED: "1"
          UNIT_DATA_DIR: unitdata
          CUR: ${{ needs.plan.outputs.current_sha }}
          REF: ${{ needs.plan.outputs.ref_sha }}
          CUR_NAME: ${{ needs.plan.outputs.current_name }}
          REF_NAME: ${{ needs.plan.outputs.against_name }}
          CURRENT_ENV: ${{ inputs.current_env }}
        run: |
          python -m pipeline.forecast.backtest --out bt --score-only --labels "$CUR_NAME" "$REF_NAME" \
            --current "$CUR" --against "$REF" --current-env "$CURRENT_ENV" --seed seed
          cat bt/report.md >> "$GITHUB_STEP_SUMMARY"
      # caches are immutable: each run saves a new one (every day the side has, cached or new),
      # and the next run restores the newest
      - if: needs.plan.outputs.fresh != 'true'
        run: rm -rf days && cp -r seed/current days
      - name: Cache the current side's days
        if: needs.plan.outputs.fresh != 'true'
        uses: actions/cache/save@v4
        with:
          path: days
          key: ${{ needs.plan.outputs.current_key }}-${{ github.run_id }}
      - if: needs.plan.outputs.fresh != 'true' && needs.plan.outputs.ref_key != needs.plan.outputs.current_key     # same code: one cache
        run: rm -rf days && cp -r seed/ref days
      - name: Cache the compared side's days
        if: needs.plan.outputs.fresh != 'true' && needs.plan.outputs.ref_key != needs.plan.outputs.current_key
        uses: actions/cache/save@v4
        with:
          path: days
          key: ${{ needs.plan.outputs.ref_key }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: backtest
          path: |
            bt/report.md
            bt/*/run.log
            seed/
          retention-days: 14
