name: COP test fetch (throwaway)

# Branch cop-test only: downloads two days of COP / DAM / ESR files for an offline check and
# commits them to this branch.  Delete the branch when done.
on:
  push:
    branches: [cop-test]
    paths: [coptest/fetch.py, .github/workflows/cop-test.yml]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch
        env:
          ERCOT_API_USERNAME: ${{ secrets.ERCOT_API_USERNAME }}
          ERCOT_API_PASSWORD: ${{ secrets.ERCOT_API_PASSWORD }}
          ERCOT_API_SUBSCRIPTION_KEY: ${{ secrets.ERCOT_API_SUBSCRIPTION_KEY }}
        run: python coptest/fetch.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coptest/out || true
          git commit -m "COP test output" && git push origin HEAD:cop-test || echo "nothing to commit"
